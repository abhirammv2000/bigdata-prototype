name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # test_health.py / test_log_analyzer.py import backend.app.main, which
        # pulls in the full RAG/embedding stack (chromadb, sentence-transformers,
        # google-genai); test_storage_io.py only needs the dags/utils modules
        # themselves. All of it runs from one `pytest tests` given the full
        # requirements.txt above - no Airflow needed, since these tests exercise
        # the storage helpers directly rather than importing an actual DAG file.
        run: pytest tests -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
